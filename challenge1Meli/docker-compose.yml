services:
  mongo:
    image: mongo:7
    container_name: meli-mongo
    command: ["mongod", "--quiet"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db   
    healthcheck:               
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  sniffer:
    build: .
    container_name: meli-sniffer
    network_mode: host
    cap_add:
      - NET_RAW                  
      - NET_ADMIN                
    env_file:
      - path: .env
        required: false       
    environment:
      MONGO_URI: mongodb://localhost:${MONGO_PORT:-27017}
    depends_on:
      mongo:
        condition: service_healthy  
    command: ["capture"]

volumes:
  mongo_data:
